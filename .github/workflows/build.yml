name: Build & unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards against a tampered gradle-wrapper.jar: it is checked against the checksum Gradle
      # publishes for the version in gradle/wrapper/gradle-wrapper.properties.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Handles the Gradle cache and the build scan summary.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug and run unit tests
        run: ./gradlew --stacktrace assembleDebug testDebugUnitTest

      - name: Assemble release
        run: ./gradlew --stacktrace assembleRelease

      # Non-blocking for now: the project has no lint baseline yet.
      - name: Lint
        continue-on-error: true
        run: ./gradlew --stacktrace :app:lintDebug

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
