name: Instrumented tests

# Runs the decoding/playback tests on a real Android system image. This is the only place the frame
# pipeline can actually be exercised end to end: seek accuracy and player state both depend on the
# platform codecs, and the app now renders every frame the user sees through the player.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same supply-chain guard the build workflow applies: gradle-wrapper.jar is checked against
      # the checksum Gradle publishes for the version in gradle/wrapper/gradle-wrapper.properties.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # On failure, dump the tags that explain *why*. Every test here depends on the emulator
          # actually having a working H.264 decoder, and when it does not the useful message is in
          # the player's log rather than in the assertion.
          script: |
            set +e
            ./gradlew --stacktrace connectedDebugAndroidTest
            EXIT=$?
            if [ "$EXIT" -ne 0 ]; then
              echo "::group::logcat (player and codec)"
              adb logcat -d -s \
                ExoPlayerImplInternal:* MediaCodecVideoRenderer:* MediaCodecRenderer:* \
                MediaCodec:* MediaCodecList:* ACodec:* OMXClient:* \
                TestRunner:I System.out:I AndroidRuntime:E | tail -300
              echo "::endgroup::"
            fi
            exit $EXIT

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
