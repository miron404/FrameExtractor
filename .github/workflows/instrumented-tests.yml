name: Instrumented tests

# Runs the decoding/playback tests on a real Android system image. This is the only place the frame
# pipeline can actually be exercised end to end: seek accuracy and player state both depend on the
# platform codecs, and the app now renders every frame the user sees through the player.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same supply-chain guard the build workflow applies: gradle-wrapper.jar is checked against
      # the checksum Gradle publishes for the version in gradle/wrapper/gradle-wrapper.properties.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner runs this script one line per `sh -c`, so nothing carries
          # between lines - a `$?` captured on its own line is always 0, and a multi-line `if` is a
          # syntax error. It has to be a single command.
          #
          # On failure, dump the tags that explain why: these tests all need the emulator to have a
          # working H.264 decoder, and when it does not, the reason is in the player's log rather
          # than in the assertion.
          script: >-
            ./gradlew --stacktrace connectedDebugAndroidTest ||
            { adb logcat -d
            'ExoPlayerImplInternal:V' 'MediaCodecVideoRenderer:V' 'MediaCodecRenderer:V'
            'MediaCodec:V' 'MediaCodecList:V' 'ACodec:V'
            'TestRunner:I' 'System.out:I' 'AndroidRuntime:E' '*:S' | tail -300; exit 1; }

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
          if-no-files-found: ignore
